name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run

  windows-cmd:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute Windows cmd shim regression
        run: node --test test/windows-cmd-invocation.test.mjs
      - run: npm run check

  packed-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build package archive
        run: echo "PACKAGE_TGZ=$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Install produced archive
        run: |
          mkdir package-smoke-test
          cd package-smoke-test
          npm init -y >/dev/null
          npm install "../$PACKAGE_TGZ"
          npx paseo-issue-automation help
